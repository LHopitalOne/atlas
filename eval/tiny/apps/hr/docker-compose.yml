name: tiny-hr

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: tiny-hr-kafka
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-41192}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:${KAFKA_HOST_PORT:-41192},INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  hr-app:
    build: ./hr-app
    profiles: ["full"]
    ports:
      - "127.0.0.1:${HR_API_PORT:-41100}:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EMPLOYEE_HIRED_TOPIC: ${EMPLOYEE_HIRED_TOPIC:-employee.hired}
      DJANGO_ALLOWED_HOSTS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 10s
    depends_on: [kafka]

  payroll:
    build: ./payroll
    profiles: ["full"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EMPLOYEE_HIRED_TOPIC: ${EMPLOYEE_HIRED_TOPIC:-employee.hired}
      HR_API_URL: http://hr-app:8000
    depends_on:
      hr-app:
        condition: service_healthy
