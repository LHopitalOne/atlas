services:
  moderation:
    build: ./moderation
    environment:
      MODERATION_HOST: 0.0.0.0
      MODERATION_GRPC_PORT: ${MODERATION_GRPC_PORT}
      MODERATION_BLOCKED_TERMS: ${MODERATION_BLOCKED_TERMS}
    ports:
      - "127.0.0.1:${MODERATION_GRPC_PORT}:${MODERATION_GRPC_PORT}"

  chat-server:
    build: ./chat-server
    environment:
      HOST: 0.0.0.0
      PORT: ${CHAT_PORT}
      MODERATION_ADDR: moderation:${MODERATION_GRPC_PORT}
    ports:
      - "127.0.0.1:${CHAT_PORT}:${CHAT_PORT}"
    depends_on:
      - moderation
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${CHAT_PORT}/healthz"]
      interval: 10s

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port ${WEB_PORT}"
    volumes:
      - ./web:/app
    environment:
      VITE_API_URL: http://127.0.0.1:${CHAT_PORT}
      VITE_WS_URL: ws://127.0.0.1:${CHAT_PORT}/ws
    ports:
      - "127.0.0.1:${WEB_PORT}:${WEB_PORT}"
    depends_on:
      - chat-server
