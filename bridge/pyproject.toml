[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-bridge"
version = "0.1.0"
description = "Map repositories with Graphify, find the HTTP links between them, and draw them on the Atlas map."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    # Graphify builds each repository's code graph (graphify update); its tree-sitter pins agree with ours below
    "graphifyy>=0.9.100,<0.10",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-rust>=0.24,<0.25",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.25",
]

[project.optional-dependencies]
links = []  # kept so `pip install 'atlas-bridge[links]'` still works; the grammars are now always installed

[project.scripts]
atlas = "atlas_bridge.cli:atlas_main"
atlas-bridge = "atlas_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["atlas_bridge*"]

[tool.setuptools.package-data]
"atlas_bridge.adapters.page" = ["atlas.html"]  # the prebuilt page: npm run build:page

[tool.ruff]
line-length = 120
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10  # see tests/test_architecture.py for the size limits


[tool.ruff.format]
quote-style = "single"

[tool.importlinter]
root_package = "atlas_bridge"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependency rule: outer rings depend on inner rings only"
type = "layers"
layers = [
    "atlas_bridge.__main__",
    "atlas_bridge.cli",
    "atlas_bridge.adapters",
    "atlas_bridge.usecases",
    "atlas_bridge.core",
]

[[tool.importlinter.contracts]]
name = "Adapters do not know each other"
type = "independence"
modules = [
    "atlas_bridge.adapters.graphify",
    "atlas_bridge.adapters.atlas",
    "atlas_bridge.adapters.treesitter",
    "atlas_bridge.adapters.page",
    "atlas_bridge.adapters.jev",
]

[[tool.importlinter.contracts]]
name = "Core and use cases do no I/O and use no parsers"
type = "forbidden"
source_modules = ["atlas_bridge.core", "atlas_bridge.usecases"]
forbidden_modules = ["json", "argparse", "subprocess", "shutil", "tree_sitter"]

[tool.coverage.run]
source = ["atlas_bridge"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true

[[tool.importlinter.contracts]]
name = "Tree-sitter languages build on the kit, never on each other"
type = "layers"
layers = [
    "atlas_bridge.adapters.treesitter.extractor",
    "atlas_bridge.adapters.treesitter.python | atlas_bridge.adapters.treesitter.rust | atlas_bridge.adapters.treesitter.javascript",
    "atlas_bridge.adapters.treesitter.kit",
]
