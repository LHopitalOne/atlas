[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-bridge"
version = "0.1.0"
description = "Draw Graphify graph.json files on the Atlas map."
license = "Apache-2.0"
requires-python = ">=3.10"

[project.scripts]
atlas-bridge = "atlas_bridge.__main__:main"

[tool.setuptools]
packages = ["atlas_bridge"]
