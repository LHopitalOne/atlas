name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-lint:
    name: JS lint and import rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ESLint and Prettier
        run: npm run lint
      - name: Import rules (test/architecture.test.js)
        run: npm run lint:imports

  js-unit:
    name: JS unit tests (coverage >= 75%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests with line, branch and function coverage gates
        run: npm run test:coverage

  python:
    name: Bridge lint, import contracts, unit tests (coverage >= 75%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bridge/requirements-dev.txt
      - uses: actions/setup-node@v7 # the bridge tests run Atlas's own spec validator
        with:
          node-version: 24
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Import contracts (import-linter)
        run: lint-imports
      - name: Unit tests with coverage
        run: coverage run -m unittest discover -s tests -t . -v
      - name: Coverage gate
        run: coverage report

  integration:
    name: Integration (Graphify -> bridge -> Atlas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bridge/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pip install -r requirements-dev.txt
      - name: Real Graphify on the shop fixture, through the bridge, into Atlas's validator
        env:
          ATLAS_INTEGRATION: '1'
          GRAPHIFY_NO_AUTO_REFRESH: '1'
        run: python -m unittest discover -s tests/integration -t . -v

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
